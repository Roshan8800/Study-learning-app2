<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studyflow</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');

        :root {
            --primary-color: #00c3ff;
            --gradient-start: #ff00ff;
            --gradient-end: #8a2be2;
            --background-color: #000000;
            --text-color: #f0f0f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            line-height: 1.6;
        }

        h1 {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff, 0 0 40px var(--primary-color);
            margin-bottom: 1rem;
            animation: flicker 1.5s infinite alternate;
        }

        h2 {
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .body-text {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        header, main, footer {
            width: 90%;
            max-width: 800px;
            padding: 2rem;
            margin-bottom: 1rem;
            border-radius: 10px;
            background-color: rgba(20, 20, 20, 0.5);
        }

        header, main {
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
        }

        footer {
            margin-top: auto;
            border-style: solid;
            border-width: 2px;
            border-image-slice: 1;
            border-image-source: linear-gradient(to right, var(--gradient-start), var(--gradient-end));
            box-shadow: 0 0 20px var(--gradient-start);
        }

        footer p {
            color: var(--gradient-start);
            text-shadow: 0 0 5px var(--gradient-start);
            font-weight: bold;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #fff,
                0 0 40px var(--primary-color),
                0 0 70px var(--primary-color);
            }
            20%, 24%, 55% {
                text-shadow: none;
            }
        }

        .trail {
            position: absolute;
            height: 6px;
            width: 6px;
            border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 5px var(--primary-color), 0 0 10px var(--primary-color);
            pointer-events: none;
            animation: fadeOut 0.6s linear;
            z-index: 9999;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            font-family: 'Nunito', sans-serif;
            border: none;
            border-radius: 50px; /* Pill shape */
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
            color: #000;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px var(--primary-color), 0 0 30px var(--primary-color);
        }

        .btn-secondary {
            background-image: linear-gradient(to right, var(--gradient-start) 0%, var(--gradient-end) 100%);
            box-shadow: 0 0 10px var(--gradient-start);
        }

        .btn-secondary:hover {
            box-shadow: 0 0 20px var(--gradient-start), 0 0 30px var(--gradient-start);
        }
    </style>
</head>
<body>
    <header>
        <h1>Studyflow</h1>
    </header>
    <main>
        <h2>Welcome to the Future of Learning</h2>
        <p class="body-text">This is a sample paragraph to demonstrate the body text typography. The design is clean, modern, and built for focus. Enjoy the seamless experience.</p>
        <div class="button-container">
            <button class="btn btn-primary">Primary Action</button>
            <button class="btn btn-secondary">Secondary Action</button>
        </div>
    </main>
    <footer>
        <p>Created by Roshan</p>
    </footer>
    <script>
        document.addEventListener('mousemove', function(e) {
            let trail = document.createElement('div');
            trail.setAttribute('class', 'trail');
            document.body.appendChild(trail);

            trail.style.left = e.pageX + 'px';
            trail.style.top = e.pageY + 'px';

            setTimeout(function() {
                document.body.removeChild(trail);
            }, 600);
        });

        const text = "Studyflow";
        const h1 = document.querySelector('h1');
        h1.innerHTML = '';

        function typeWriter(text, i) {
            if (i < text.length) {
                h1.innerHTML += text.charAt(i);
                i++;
                setTimeout(() => typeWriter(text, i), 150);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            typeWriter(text, 0);
        });
    </script>
</body>
</html>
